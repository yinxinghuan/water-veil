<!doctype html>
<html lang="zh-CN">

        <strong id="identityName"></strong>
      </footer>

      <div class="wv-ghost" id="ghost" aria-hidden="true">
        <span class="wv-ghost__trail"></span>

      <div class="wv-sealed" id="sealed" aria-live="polite">
        <span id="sealedTitle">倒影已平静</span>
        <strong id="sealedName"></strong>
      </div>

      <section class="wv-error" id="error" hidden>
        <strong id="errorTitle">水面没有显现</strong>
        <span id="errorBody">请重新载入这片倒影</span>

    <script type="module" src="./src/main.js"></script>
